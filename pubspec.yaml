name: coke_platform
description: Coke Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_bloc: ^8.1.3
  flutter_easyloading: ^3.0.5
  equatable: ^2.0.5
  logger: ^2.0.2+1
  get_it: ^7.6.4
  http: ^1.1.0
  intl_utils: ^2.8.5
  build_runner: ^2.4.6
  json_annotation: ^4.8.1
  intl: ^0.18.1
  fluttertoast: ^8.2.2
  flutter_svg: ^1.1.6
  iconify_flutter: ^0.0.5
  cached_network_image: ^3.3.0
  flutter_switch: ^0.3.2
  go_router: ^13.2.0
  url_strategy: ^0.2.0
  flutter_screenutil: ^5.9.3
  sprintf: ^7.0.0
  shared_preferences: ^2.2.3
  table_calendar: ^3.0.9
  flutter_dropzone: ^4.0.1
  file_picker: ^8.0.5
  dotted_border: ^2.1.0
  url_launcher: ^6.2.4
  month_picker_dialog: ^2.12.0
  firebase_core: 2.31.0
  firebase_auth: 4.19.4
  firebase_database: 10.5.4
  firebase_storage: 11.7.4
  firebase_auth_web: 5.11.4
  excel: ^4.0.3
  collection: ^1.18.0
  flutter_smart_dialog: ^4.9.8
  provider: ^6.1.2
  flutter_animate_on_scroll: ^0.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  json_serializable: ^6.7.1
  flutter_gen_runner: any

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/images/about/
    - assets/images/overview/
    - assets/images/essence/
    - assets/images/career/
    - assets/images/journey/
    - assets/resources/
    - assets/font/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/font/Poppins-semi-bold.ttf
          weight: 600
        - asset: assets/font/Poppins-bold.ttf
          weight: 700
        - asset: assets/font/Poppins-black.ttf
          weight: 800
        - asset: assets/font/Poppins-medium.ttf
          weight: 500
        - asset: assets/font/Poppins-regular.ttf
          weight: 400
        - asset: assets/font/Poppins-light.ttf
          weight: 300
        - asset: assets/font/Poppins-light.ttf
          weight: 200
        - asset: assets/font/Poppins-semi-bold-italic.otf
          weight: 600
          style: italic
        - asset: assets/font/Poppins-bold-italic.otf
          weight: 700
          style: italic
        - asset: assets/font/Poppins-black-italic.otf
          weight: 800
          style: italic
        - asset: assets/font/Poppins-medium-italic.otf
          weight: 500
          style: italic
        - asset: assets/font/Poppins-italic.otf
          weight: 400
          style: italic
        - asset: assets/font/Poppins-light-italic.otf 
          weight: 300
          style: italic
        - asset: assets/font/Poppins-light-italic.otf
          weight: 200
          style: italic

flutter_gen:
  output: lib/generated/
  integrations:
    flutter_svg: true
flutter_intl:
  enabled: true