name: coke_platform
description: Coke Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.2 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_bloc: ^8.1.3
  flutter_easyloading: ^3.0.5
  equatable: ^2.0.5
  logger: ^2.0.2+1
  get_it: ^7.6.4
  http: ^1.1.0
  intl_utils: ^2.8.5
  build_runner: ^2.4.6
  json_annotation: ^4.8.1
  intl: ^0.18.1
  fluttertoast: ^8.2.2
  flutter_svg: ^1.1.6
  iconify_flutter: ^0.0.5
  cached_network_image: ^3.3.0
  flutter_switch: ^0.3.2
  go_router: ^13.2.0
  url_strategy: ^0.2.0
  flutter_screenutil: ^5.9.3
  sprintf: ^7.0.0
  shared_preferences: ^2.2.3
  table_calendar: ^3.0.9
  flutter_dropzone: ^3.0.7
  firebase_core: ^2.24.2
  file_picker: ^8.0.0+1
  firebase_storage: ^11.6.0
  firebase_database: ^10.4.0
  dotted_border: ^2.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  json_serializable: ^6.7.1
  flutter_gen_runner: any

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/resources/

flutter_gen:
  output: lib/generated/
  integrations:
    flutter_svg: true
flutter_intl:
  enabled: true